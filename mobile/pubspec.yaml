name: edutrack
description: "EduTrack - Gamified Exam Prep Platform"
publish_to: 'none'
version: 2.3.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.8.4

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Environment
  flutter_dotenv: ^5.2.1

  # Local Storage
  shared_preferences: ^2.3.4

  # UI
  google_fonts: ^6.2.1
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.16
  percent_indicator: ^4.2.3
  fl_chart: ^0.70.2
  confetti: ^0.8.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.4

  # Icons (using Material Icons)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.2
  json_serializable: ^6.9.2

flutter:
  uses-material-design: true
  assets:
    - assets/.env
    - assets/images/
    - assets/icons/
